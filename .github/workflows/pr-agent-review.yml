name: PR-Agent review

# Reusable PR-Agent review. The caller picks the model; the review is billed to the API
# account that holds the matching key (ANTHROPIC_KEY for anthropic/ models, OPENAI_KEY for
# OpenAI ones). The review job fails when the review does not complete. Findings are posted
# inline and in one persistent summary comment, and the findings job fails while any of them
# is still open. See README.md for the caller side.
#
# Both jobs run in the PR-Agent image, so the workflow works on hosted runners and on
# self-hosted runners that require a job container. Neither job checks out or runs pull
# request code: PR-Agent reads the diff through the API in restricted mode, and the findings
# job only reads comment text.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for both jobs.
        type: string
        default: ubuntu-latest
      model:
        description: PR-Agent model id, such as anthropic/claude-opus-5-5 or gpt-6.1-sol.
        type: string
        default: anthropic/claude-opus-5-5
      reasoning-effort:
        description: Reasoning effort (OpenAI) or adaptive-thinking effort (Claude).
        type: string
        default: high
      instructions:
        description: What the repository is and what the review should focus on. The shared reporting rules are appended.
        type: string
        required: true
      ignore-glob:
        description: JSON list of path globs to leave out of the review, such as lockfiles and generated code. Binary files are already left out.
        type: string
        default: "[]"
    secrets:
      ANTHROPIC_KEY:
        description: Anthropic API key, needed for anthropic/ models.
        required: false
      OPENAI_KEY:
        description: OpenAI API key, needed for OpenAI models.
        required: false

jobs:
  review:
    # Fork pull requests get no secrets, and drafts are reviewed once marked ready. Callers
    # must not add an issue_comment trigger: PR-Agent does not check who wrote a slash
    # command, so any commenter could spend API credits.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ inputs.runs-on }}
    # pragent/pr-agent:0.49.0-github_action, pinned by its multi-platform index digest.
    container:
      image: pragent/pr-agent@sha256:b1ed6e8de56eb4d6e4169ee0d5c209bb5ed1ef071a01c0c042c64b80192a785c
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Some self-hosted job containers (ARC kubernetes-novolume) start without the webhook
      # payload that PR-Agent reads, so it is written from the event context when missing.
      - name: Prepare event
        shell: bash
        env:
          EVENT_JSON: ${{ toJSON(github.event) }}
        run: |
          set -euo pipefail
          if [ ! -s "$GITHUB_EVENT_PATH" ]; then
            mkdir -p "$(dirname "$GITHUB_EVENT_PATH")"
            printf '%s' "$EVENT_JSON" > "$GITHUB_EVENT_PATH"
          fi

      # PR-Agent 0.49.0 exits successfully without reviewing when GITHUB_TOKEN is missing, and
      # only logs a missing model key, so both are checked here to keep the check honest. Only
      # the key for the selected model's provider reaches PR-Agent.
      - name: Review
        shell: bash
        env:
          MODEL: ${{ inputs.model }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "reopened", "ready_for_review", "synchronize"]'
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          # Describe would rewrite the pull request description.
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"
          GITHUB_ACTION_CONFIG.FAIL_ON_TOOL_ERRORS: "true"
          # Check-run output would turn off persistent finding state.
          GITHUB.PUBLISH_AS_CHECK_RUN: "false"

          CONFIG.MODEL: ${{ inputs.model }}
          # Fail visibly rather than quietly reviewing with a weaker model.
          CONFIG.FALLBACK_MODELS: "[]"
          CONFIG.REASONING_EFFORT: ${{ inputs.reasoning-effort }}
          # Claude 5 models only think through the adaptive API. It is off for other models,
          # where PR-Agent would log a warning on every call.
          CONFIG.ENABLE_CLAUDE_ADAPTIVE_THINKING: ${{ (startsWith(inputs.model, 'anthropic/') || startsWith(inputs.model, 'claude-')) && 'true' || 'false' }}
          # Sized for complete reviews rather than low cost. Inputs stay under OpenAI's 272K
          # long-context price tier; the output limit includes reasoning tokens.
          CONFIG.MAX_MODEL_TOKENS: "200000"
          CONFIG.MAX_OUTPUT_TOKENS: "64000"
          CONFIG.PATCH_EXTRA_LINES_BEFORE: "10"
          CONFIG.PATCH_EXTRA_LINES_AFTER: "5"
          CONFIG.AI_TIMEOUT: "600"
          CONFIG.PROPAGATE_TOOL_ERRORS: "true"
          CONFIG.RESTRICTED_MODE: "true"
          CONFIG.OUTPUT_RUN_DETAILS: "true"
          CONFIG.OUTPUT_RUN_COST: "true"

          PR_REVIEWER.PERSISTENT_COMMENT: "true"
          PR_REVIEWER.PERSISTENT_FINDING_STATE: "true"
          PR_REVIEWER.PUBLISH_OUTPUT_NO_SUGGESTIONS: "true"
          PR_REVIEWER.ENABLE_REVIEW_COVERAGE_FOOTER: "true"
          PR_REVIEWER.FINAL_UPDATE_MESSAGE: "false"
          PR_REVIEWER.INLINE_KEY_ISSUES: "true"
          PR_REVIEWER.NUM_MAX_FINDINGS: "10"
          PR_REVIEWER.ENABLE_LARGE_PR_CHUNKING: "true"
          PR_REVIEWER.MAX_NUMBER_OF_CALLS: "5"
          PR_REVIEWER.ENABLE_REVIEW_LABELS_SECURITY: "false"
          PR_REVIEWER.ENABLE_REVIEW_LABELS_EFFORT: "false"
          PR_REVIEWER.EXTRA_INSTRUCTIONS: |
            ${{ inputs.instructions }}
            Report only defects you can tie to a concrete failure: say what input or sequence of events goes wrong and what happens. Do not comment on style or naming.
            Do not report missing tests as a standalone finding. When you report a concrete defect, describe the focused test that would expose it.
          IGNORE.GLOB: ${{ inputs.ignore-glob }}
        run: |
          set -euo pipefail
          if [ -z "$GITHUB_TOKEN" ]; then echo "::error::GITHUB_TOKEN is empty."; exit 1; fi
          # Bash cannot unset or assign PR-Agent's dotted variable names, so env(1) does it.
          case "$MODEL" in
            anthropic/*|claude-*)
              key_name=ANTHROPIC_KEY; key=$ANTHROPIC_KEY
              launch=(env -u OPENAI_KEY -u ANTHROPIC_KEY "ANTHROPIC.KEY=$ANTHROPIC_KEY") ;;
            openai/*|gpt-*|o[0-9]*)
              key_name=OPENAI_KEY; key=$OPENAI_KEY
              launch=(env -u ANTHROPIC_KEY) ;;
            *)
              echo "::error::The workflow has no API key input for model $MODEL. Use an anthropic/ or OpenAI model."
              exit 1 ;;
          esac
          if [ -z "$key" ]; then echo "::error::Model $MODEL needs the $key_name secret, which is not set."; exit 1; fi
          # The image's own entrypoint, called by path: a login shell can drop the venv from PATH.
          exec "${launch[@]}" /app/.venv/bin/python /app/pr_agent/servers/github_action_runner.py

  # PR-Agent cannot fail a check on its findings, so this job reads them back from the pull
  # request. It is separate from the review so that, after resolving a thread to dismiss a
  # finding, "Re-run failed jobs" turns it green without paying for another review. It also
  # resolves PR-Agent's threads for findings a later review marked resolved, which PR-Agent
  # does not do on GitHub itself. GitHub only lets a token resolve review threads with
  # contents: write.
  findings:
    needs: review
    runs-on: ${{ inputs.runs-on }}
    container:
      image: pragent/pr-agent@sha256:b1ed6e8de56eb4d6e4169ee0d5c209bb5ed1ef071a01c0c042c64b80192a785c
    timeout-minutes: 5
    permissions:
      contents: write
      issues: read
      pull-requests: write
    steps:
      # Standard library only; tests/test_findings.py loads this script from this file.
      - name: Fail on open findings
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request

          SUMMARY_MARKER = "<!-- pr-agent:review:full -->"
          STATE_START = "<!-- pr-agent-review-state:v1"
          STATE_END = "-->"
          SUMMARY_AUTHOR = "github-actions[bot]"
          # GraphQL reports the workflow token's author without the [bot] suffix.
          THREAD_AUTHOR_PREFIX = "github-actions"

          THREADS_QUERY = """
          query($owner: String!, $name: String!, $pr: Int!, $after: String) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $pr) {
                reviewThreads(first: 100, after: $after) {
                  pageInfo { hasNextPage endCursor }
                  nodes { id isResolved path comments(first: 1) { nodes { author { login } url body } } }
                }
              }
            }
          }"""

          RESOLVE_MUTATION = """
          mutation($id: ID!) { resolveReviewThread(input: {threadId: $id}) { thread { isResolved } } }"""


          class GitHub:
              def __init__(self, token, api_url, graphql_url):
                  self.token = token
                  self.api_url = api_url.rstrip("/")
                  self.graphql_url = graphql_url

              def _send(self, method, url, body=None):
                  data = None if body is None else json.dumps(body).encode()
                  request = urllib.request.Request(url, data=data, method=method, headers={
                      "Authorization": f"Bearer {self.token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "pr-agent-review-findings",
                  })
                  # Transient server and network errors are retried; client errors are not.
                  for attempt in range(3):
                      try:
                          with urllib.request.urlopen(request, timeout=30) as response:
                              return json.load(response), response.headers
                      except urllib.error.HTTPError as error:
                          if error.code < 500 or attempt == 2:
                              raise
                      except urllib.error.URLError:
                          if attempt == 2:
                              raise
                      time.sleep(2 ** attempt)

              def rest_list(self, path):
                  url = f"{self.api_url}/{path}?per_page=100"
                  items = []
                  while url:
                      page, headers = self._send("GET", url)
                      items.extend(page)
                      match = re.search(r'<([^>]+)>;\s*rel="next"', headers.get("Link") or "")
                      url = match.group(1) if match else None
                  return items

              def graphql(self, query, variables):
                  result, _ = self._send("POST", self.graphql_url, {"query": query, "variables": variables})
                  if result.get("errors"):
                      raise RuntimeError("; ".join(error.get("message", str(error)) for error in result["errors"]))
                  return result["data"]

              def summary_comment(self, repo, pr):
                  comments = self.rest_list(f"repos/{repo}/issues/{pr}/comments")
                  matches = [c for c in comments
                             if (c.get("user") or {}).get("login") == SUMMARY_AUTHOR and SUMMARY_MARKER in (c.get("body") or "")]
                  return matches[-1] if matches else None

              def bot_threads(self, repo, pr):
                  """Every inline thread the workflow token opened, resolved or not."""
                  owner, name = repo.split("/", 1)
                  threads, after = [], None
                  while True:
                      data = self.graphql(THREADS_QUERY, {"owner": owner, "name": name, "pr": int(pr), "after": after})
                      page = data["repository"]["pullRequest"]["reviewThreads"]
                      for node in page["nodes"]:
                          comments = node["comments"]["nodes"]
                          if not comments:
                              continue
                          first = comments[0]
                          if not ((first.get("author") or {}).get("login") or "").startswith(THREAD_AUTHOR_PREFIX):
                              continue
                          threads.append({"id": node["id"], "resolved": node["isResolved"], "path": node["path"],
                                          "url": first["url"], "body": first["body"] or ""})
                      if not page["pageInfo"]["hasNextPage"]:
                          return threads
                      after = page["pageInfo"]["endCursor"]

              def resolve_thread(self, thread_id):
                  self.graphql(RESOLVE_MUTATION, {"id": thread_id})


          def split_summary(body):
              """Split the summary into its pr-agent-review-state JSON (or None) and the visible text."""
              lines = body.replace("\r\n", "\n").split("\n")
              visible, state_lines, in_state, seen_state = [], [], False, False
              for line in lines:
                  if in_state:
                      if line == STATE_END:
                          in_state = False
                      elif not seen_state:
                          state_lines.append(line)
                  elif line == STATE_START:
                      in_state = True
                      seen_state = bool(state_lines)
                  else:
                      visible.append(line)
              state = json.loads("\n".join(state_lines)) if state_lines else None
              return state, "\n".join(visible)


          def reviewed_sha(state, body):
              """The commit the summary describes, or "" when it does not say."""
              if state is not None:
                  return (state.get("last_run") or {}).get("head_sha") or ""
              match = re.search(r"Review updated until commit [^ )]*/commit/([0-9a-f]{40})", body)
              return match.group(1) if match else ""


          def has_verdict(visible, emoji, text):
              """Verdicts are read from their own table rows, outside the state block, so finding
              text that quotes them cannot stand in for them."""
              row = f"<tr><td>{emoji}&nbsp;<strong>{text}</strong></td></tr>"
              return row in visible.split("\n")


          def posts(thread, finding):
              """Threads are matched by file as well as text, so that a finding repeated in another
              file is not cleared by resolving the first one."""
              body = finding.get("body")
              return isinstance(body, str) and thread["path"] == finding.get("path") and thread["body"].startswith(body)


          def open_findings(state, threads, summary_url):
              """An active finding is open until every inline thread posting it is resolved. One that
              could not be posted inline stays open until a review drops it."""
              lines = []
              for finding in state.get("findings") or []:
                  if finding.get("state") != "ACTIVE":
                      continue
                  matching = [t for t in threads if posts(t, finding)]
                  unresolved = [t for t in matching if not t["resolved"]]
                  if matching and not unresolved:
                      continue
                  location = finding.get("path") or "?"
                  if finding.get("line_start") is not None:
                      location += f":{finding['line_start']}"
                  url = unresolved[0]["url"] if unresolved else summary_url
                  title = (finding.get("body") or "").split("\n")[0][:200]
                  line = f"- [{location}]({url}) {title}"
                  if not matching:
                      line += " (only in the summary, so it clears on the next review)"
                  lines.append(line)
              return lines


          def fixed_thread_ids(state, threads):
              """Open threads of findings PR-Agent marked resolved, unless the thread also matches a
              finding that is still active."""
              findings = state.get("findings") or []
              active = [f for f in findings if f.get("state") == "ACTIVE"]
              resolved = [f for f in findings if f.get("state") == "RESOLVED"]
              return [t["id"] for t in threads
                      if not t["resolved"]
                      and any(posts(t, f) for f in resolved)
                      and not any(posts(t, f) for f in active)]


          def coverage_warning(state):
              last_run = state.get("last_run") or {}
              excluded = last_run.get("excluded_files") or []
              if last_run.get("complete") is False or excluded:
                  return f"The review was incomplete. Files left out: {', '.join(excluded)}"
              return None


          def main(github, repo, pr, head_sha, out=print, summary_path=None, sleep=time.sleep):
              def report(text):
                  if summary_path:
                      try:
                          with open(summary_path, "a", encoding="utf-8") as summary_file:
                              summary_file.write(text + "\n")
                      except OSError:
                          pass
                  out(text)

              # GitHub can briefly serve the comment from before the review job edited it, so wait
              # until it names this commit.
              for attempt in range(6):
                  comment = github.summary_comment(repo, pr)
                  if comment is None:
                      out("::error::PR-Agent posted no review summary on this pull request.")
                      return 1
                  body = comment["body"]
                  state, visible = split_summary(body)
                  reviewed = reviewed_sha(state, body)
                  if not reviewed or reviewed == head_sha:
                      break
                  if attempt < 5:
                      sleep(10)
              else:
                  out(f"::error::The review summary is for commit {reviewed[:7]}, not {head_sha[:7]}. Re-run the whole workflow.")
                  return 1

              summary_url = comment["html_url"]
              open_count = 0
              if state is not None:
                  threads = github.bot_threads(repo, pr)
                  lines = open_findings(state, threads, summary_url)
                  if lines:
                      report("\n".join(lines))
                      open_count += len(lines)
                  # This only tidies the pull request, so a thread that cannot be resolved is a
                  # warning, not a failure.
                  for thread_id in fixed_thread_ids(state, threads):
                      try:
                          github.resolve_thread(thread_id)
                          out(f"Resolved the thread of a fixed finding ({thread_id}).")
                      except Exception as error:  # noqa: BLE001
                          out(f"::warning::Could not resolve review thread {thread_id}: {error}")
                  # Coverage gaps are reported, not failed.
                  warning = coverage_warning(state)
                  if warning:
                      out(f"::warning::{warning}")
              elif not has_verdict(visible, "⚡", "No major issues detected"):
                  report(f"- The [review summary]({summary_url}) reports issues but has no finding state to track them by.")
                  open_count += 1

              if not has_verdict(visible, "🔒", "No security concerns identified"):
                  report(f"- The [review summary]({summary_url}) reports a security concern, which clears on the next review.")
                  open_count += 1

              if open_count:
                  out(f"::error::{open_count} open PR-Agent finding(s). Fix them, or resolve a thread to dismiss its finding and re-run this job.")
                  return 1
              report("No open PR-Agent findings.")
              return 0


          if __name__ == "__main__":
              api_url = os.environ.get("GITHUB_API_URL", "https://api.github.com")
              client = GitHub(os.environ["GH_TOKEN"], api_url, os.environ.get("GITHUB_GRAPHQL_URL", f"{api_url}/graphql"))
              sys.exit(main(client, os.environ["REPO"], os.environ["PR"], os.environ["HEAD_SHA"],
                            summary_path=os.environ.get("GITHUB_STEP_SUMMARY")))
